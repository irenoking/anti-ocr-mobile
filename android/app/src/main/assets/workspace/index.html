<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>antiocr</title><link rel="stylesheet" href="style.css"></head><body><aside class="sidebar"><header class="brand"><div class="brand-mark">◉</div><div><h1>antiocr</h1><p>本地图片保护工作台</p></div><span class="sparkle">✦</span></header><div class="notice"><span class="notice-icon">✓</span><div><b>隐私守护中</b><br>所有处理均在设备本地完成</div></div><div class="section-heading"><div><span>创作面板</span><h3>算法管线</h3></div><span class="chip">可拖动排序</span></div><div id="pipelineContainer"></div><button id="resetConfigBtn" class="secondary-button">↻ 恢复默认参数</button></aside><div id="panelResizer" class="panel-resizer" role="separator" aria-label="调整参数和图片区域比例" aria-orientation="horizontal"><span></span></div><main id="dropZone"><div class="canvas-glow glow-one"></div><div class="canvas-glow glow-two"></div><div id="dropHint"><div class="upload-orb">⌁</div><strong>挑一张图片，开始玩色彩</strong><span>点击导入 JPG、PNG 或 WebP</span><em>图片仅在你的设备中处理</em></div><input type="file" id="hiddenFileInput" accept="image/*" hidden><canvas id="mainCanvas"></canvas><div class="tools"><span id="status"><i></i> 等待导入图片</span><button id="resetImageBtn" class="secondary-button">↺ 还原</button><button id="downloadBtn">↓ 保存图片</button></div></main><script src="app.js"></script></body></html>
